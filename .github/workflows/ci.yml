name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax smoke test (compileall on backend, dependency-free)
        run: |
          python -m compileall -q backend
          echo "Backend sources compile cleanly (no heavy ML deps installed in CI)."
